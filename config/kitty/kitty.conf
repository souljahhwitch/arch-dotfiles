# vim:ft=kitty
## DEEZ
## name:     Catppuccin Kitty Mocha
## author:   Catppuccin Org
## license:  MIT
## upstream: https://github.com/catppuccin/kitty/blob/main/themes/mocha.conf
## blurb:    Soothing pastel theme for the high-spirited!


confirm_os_window_close 0


dynamic_background_opacity yes
background_opacity 0.7


# The basic colors
foreground              #d399a1
background              #222222
selection_foreground    #222222
selection_background    #886EAE

# Cursor colors
cursor                  #D399A1
cursor_text_color       #D399A1

# URL underline color when hovering with mouse
url_color               #886EAE

# Kitty window border colors
active_border_color     #D399A1
inactive_border_color   #222222

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# Colors for marks (marked text in the terminal)
mark1_foreground #222222
mark1_background #d399a1
mark2_foreground #222222
mark2_background #886eae
mark3_foreground #222222
mark3_background #d399a1

# The 16 terminal colors

# black
color0 #45475a
color8 #585b70

# red
color1 #f38ba8
color9 #f38ba8

# green
color2  #886eae
color10 #886eae

# yellow
color3  #f9e2af
color11 #f9e2af

# blue
color4  #d399a1
color12 #d399a1

# magenta
color5  #f5c2e7
color13 #f5c2e7

# cyan
color6  #886eae
color14 #886eae

# white
color7  #d399a1
color15 #a6adc8


# ─────────────────────────────────────
# Startup
# ─────────────────────────────────────

shell bash -c 'fastfetch; exec bash'


